<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no, maximum-scale=1" />
  <title>ukitouch</title>
  <style>
    html {
      background: #f9fafb;
      color-scheme: light;
    }

    html.dark {
      background: #000;
      color-scheme: dark;
    }
  </style>
  <script>
    const theme = localStorage.getItem("ukitouch.theme");
    if (theme === "dark" || (theme !== "light" && matchMedia("(prefers-color-scheme: dark)").matches))
      document.documentElement.classList.add("dark");
  </script>
  <script type="importmap">
    {
      "imports": {
        "@ukitouch/extension": "/api.js",
        "react": "/react.js",
        "react/jsx-runtime": "/jsx-runtime.js"
      }
    }
  </script>
</head>

<body>
  <div id="root" class="flex h-full"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
